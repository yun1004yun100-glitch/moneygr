<svg width="320" height="48" viewBox="0 0 320 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="20%" stop-color="#fde076"/>
      <stop offset="50%" stop-color="#c89222"/>
      <stop offset="80%" stop-color="#ffe99a"/>
      <stop offset="100%" stop-color="#784c0c"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fff8d9"/>
      <stop offset="45%" stop-color="#ffd660"/>
      <stop offset="75%" stop-color="#e29e20"/>
      <stop offset="100%" stop-color="#8b5b0d"/>
    </linearGradient>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(2,42,35,0.98)"/>
      <stop offset="50%" stop-color="rgba(4,88,72,0.98)"/>
      <stop offset="100%" stop-color="rgba(2,42,35,0.98)"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="gl" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Left Mini Wing Ornaments -->
  <g filter="url(#sh)">
    <path d="M38 24 C22 15, 8 8, 2 3 C12 16, 25 24, 34 27 C18 29, 6 34, 4 38 C16 38, 28 34, 38 30 Z" fill="url(#goldPlate)"/>
    <polygon points="32,24 36,20 42,24 36,28" fill="#00ffc8" stroke="#ffffff" stroke-width="0.8" filter="url(#gl)"/>
  </g>

  <!-- Right Mini Wing Ornaments -->
  <g filter="url(#sh)">
    <path d="M282 24 C298 15, 312 8, 318 3 C308 16, 295 24, 286 27 C302 29, 314 34, 316 38 C304 38, 292 34, 282 30 Z" fill="url(#goldPlate)"/>
    <polygon points="288,24 284,20 278,24 284,28" fill="#00ffc8" stroke="#ffffff" stroke-width="0.8" filter="url(#gl)"/>
  </g>

  <!-- Center Plaque Frame -->
  <g filter="url(#sh)">
    <!-- Outer Gold Frame -->
    <path d="M30 24 L42 6 L278 6 L290 24 L278 42 L42 42 Z" fill="url(#goldPlate)" stroke="#fffde8" stroke-width="1.2"/>
    <!-- Emerald Center Field -->
    <path d="M36 24 L46 9 L274 9 L284 24 L274 39 L46 39 Z" fill="url(#emeraldBg)" stroke="#ffd866" stroke-width="1"/>
    <!-- Inner Fine Glow Line -->
    <path d="M42 24 L50 12 L270 12 L278 24 L270 36 L50 36 Z" fill="none" stroke="rgba(0,255,200,0.5)" stroke-width="0.8" stroke-dasharray="3,2"/>
  </g>

  <!-- Top and Bottom Mini Center Jewels -->
  <polygon points="160,4 163,7 160,10 157,7" fill="#ffea88" stroke="#fff" stroke-width="0.6" filter="url(#gl)"/>
  <polygon points="160,38 163,41 160,44 157,41" fill="#00ffc8" stroke="#fff" stroke-width="0.6" filter="url(#gl)"/>

  <!-- Diamond Sparkles -->
  <g fill="#ffffff" opacity="0.95" filter="url(#gl)">
    <path d="M58 16 Q59.5 16 59.5 14.5 Q59.5 16 61 16 Q59.5 16 59.5 17.5 Q59.5 16 58 16 Z"/>
    <path d="M262 16 Q263.5 16 263.5 14.5 Q263.5 16 265 16 Q263.5 16 263.5 17.5 Q263.5 16 262 16 Z"/>
  </g>

  <!-- Big 3D Bold Text: 연승의 신 -->
  <g filter="url(#sh)">
    <text x="160" y="31.5" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="23" font-weight="950" text-anchor="middle" fill="#000" letter-spacing="3">연승의 신</text>
    <text x="160" y="30.5" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="23" font-weight="950" text-anchor="middle" stroke="#381c00" stroke-width="4.5" fill="none" letter-spacing="3">연승의 신</text>
    <text x="160" y="30.5" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="23" font-weight="950" text-anchor="middle" stroke="#ffe992" stroke-width="1.4" fill="none" letter-spacing="3">연승의 신</text>
    <text x="160" y="30.5" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="23" font-weight="950" text-anchor="middle" fill="url(#goldText)" letter-spacing="3">연승의 신</text>
  </g>

  <!-- Top Gloss Highlight -->
  <path d="M48 11 L272 11" stroke="rgba(255,255,255,0.75)" stroke-width="0.9" stroke-linecap="round"/>
</svg>
